{
  "openapi": "3.0.3",
  "info": {
    "title": "Preps Fitness business API",
    "version": "0.1.0",
    "description": "Sprint 0 foundation. Better Auth endpoints use their native contract; see docs/auth-contract.md. Empty entitlements intentionally grant no benefits."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "paths": {
    "/me": {
      "get": {
        "operationId": "getMe",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Me"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "Request rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Request rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Request rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/branches/{branchId}": {
      "get": {
        "operationId": "getBranch",
        "parameters": [
          {
            "in": "path",
            "name": "branchId",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "id",
                        "name"
                      ]
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "Request rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Request rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Request rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Request rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "better-auth.session_token",
        "description": "Development cookie name. Production uses __Secure-better-auth.session_token; use browser cookie handling / Better Auth client, not manual token storage."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "reasonCode": {
                "type": "string",
                "enum": [
                  "UNAUTHENTICATED",
                  "ACCOUNT_ACCESS_DENIED",
                  "BRANCH_ACCESS_DENIED",
                  "NOT_FOUND",
                  "SERVICE_UNAVAILABLE",
                  "INVALID_JSON",
                  "PAYLOAD_TOO_LARGE"
                ]
              },
              "requestId": {
                "type": "string"
              }
            },
            "required": [
              "reasonCode",
              "requestId"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "Me": {
        "type": "object",
        "properties": {
          "user": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "email": {
                "type": "string",
                "format": "email"
              }
            },
            "required": [
              "id",
              "name",
              "email"
            ]
          },
          "gymId": {
            "type": "string"
          },
          "branchAccess": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "branchId": {
                  "type": "string"
                },
                "role": {
                  "type": "string",
                  "enum": [
                    "owner",
                    "admin",
                    "pt",
                    "member"
                  ]
                }
              },
              "required": [
                "branchId",
                "role"
              ]
            }
          },
          "entitlements": {
            "type": "array",
            "maxItems": 0,
            "items": {
              "type": "string"
            },
            "description": "Always empty in this slice; benefit evaluator is pending."
          }
        },
        "required": [
          "user",
          "gymId",
          "branchAccess",
          "entitlements"
        ]
      }
    }
  }
}
