  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "better-auth.session_token",
        "description": "Development cookie name. Production uses __Secure-better-auth.session_token; use browser cookie handling / Better Auth client, not manual token storage."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "reasonCode": {
                "type": "string",
                "enum": [
                  "UNAUTHENTICATED",
                  "ACCOUNT_ACCESS_DENIED",
                  "BRANCH_ACCESS_DENIED",
                  "NOT_FOUND",
                  "SERVICE_UNAVAILABLE",
                  "INVALID_JSON",
                  "PAYLOAD_TOO_LARGE"
                ]
              },
              "requestId": {
                "type": "string"
              }
            },
            "required": [
              "reasonCode",
              "requestId"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "Me": {
        "type": "object",
        "properties": {
          "user": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "email": {
                "type": "string",
                "format": "email"
              }
            },
            "required": [
              "id",
              "name",
              "email"
            ]
          },
          "gymId": {
            "type": "string"
          },
          "branchAccess": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "branchId": {
                  "type": "string"
                },
                "role": {
                  "type": "string",
                  "enum": [
                    "owner",
                    "admin",
                    "pt",
                    "member"
                  ]
                },
                "branchName": {
                  "type": "string",
                  "description": "Display name of this authorized branch in the deployment gym."
                }
              },
              "required": [
                "branchId",
                "role",
                "branchName"
              ]
            }
          },
          "entitlements": {
            "type": "array",
            "maxItems": 0,
            "items": {
              "type": "string"
            },
            "description": "Always empty in this slice; benefit evaluator is pending."
          }
        },
        "required": [
          "user",
          "gymId",
          "branchAccess",
          "entitlements"
        ]
      },
      "RegistrationIdentity": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "fullName": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "description": "Trim, reject blank."
          },
          "phone": {
            "type": "string",
            "maxLength": 16,
            "pattern": "^\\+[1-9][0-9]{7,14}$",
            "description": "Canonical international WhatsApp contact; not proof of ownership."
          },
          "address": {
            "type": "string",
            "maxLength": 1000,
            "minLength": 1
          },
          "birthPlace": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "birthDate": {
            "type": "string",
            "maxLength": 10,
            "format": "date",
            "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
            "description": "Real calendar date >=1000-01-01 and not after context.today in gym timezone. No age threshold."
          },
          "email": {
            "type": "string",
            "maxLength": 254,
            "format": "email"
          }
        },
        "required": [
          "fullName",
          "phone",
          "address",
          "birthDate"
        ]
      },
      "RegistrationAction": {
        "type": "string",
        "enum": [
          "create",
          "edit",
          "submit",
          "approve",
          "reject",
          "clarify"
        ]
      },
      "RegistrationStatus": {
        "type": "string",
        "enum": [
          "draft",
          "pending_review",
          "needs_clarification",
          "approved",
          "rejected"
        ]
      },
      "RegistrationContext": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "gymId": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "branchId": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "timezone": {
            "type": "string",
            "maxLength": 100,
            "description": "Configured IANA gym timezone; no client-supplied authority."
          },
          "today": {
            "type": "string",
            "maxLength": 10,
            "format": "date",
            "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
          },
          "asOf": {
            "type": "string",
            "format": "date-time"
          },
          "allowedActions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RegistrationAction"
            }
          }
        },
        "required": [
          "gymId",
          "branchId",
          "timezone",
          "today",
          "asOf",
          "allowedActions"
        ]
      },
      "Money": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "amount": {
            "type": "string",
            "maxLength": 16,
            "pattern": "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$",
            "example": "250000.00",
            "description": "Nonnegative DECIMAL(14,2), canonical two fractional digits. Maximum 999999999999.99. Never convert through a float."
          },
          "currency": {
            "type": "string",
            "maxLength": 3,
            "pattern": "^[A-Z]{3}$",
            "example": "IDR"
          }
        },
        "required": [
          "amount",
          "currency"
        ]
      },
      "PlanVersion": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "planId": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "branchId": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "name": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1
          },
          "publishedAt": {
            "type": "string",
            "format": "date-time"
          },
          "price": {
            "$ref": "#/components/schemas/Money"
          },
          "duration": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "value": {
                "type": "integer",
                "minimum": 1
              },
              "unit": {
                "type": "string",
                "enum": [
                  "day",
                  "month"
                ]
              }
