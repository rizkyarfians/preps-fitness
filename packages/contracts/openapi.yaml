      "Registration": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "branchId": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "memberId": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "identity": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "fullName": {
                "type": "string",
                "maxLength": 200,
                "minLength": 1,
                "description": "Trim, reject blank."
              },
              "phone": {
                "type": "string",
                "maxLength": 16,
                "pattern": "^\\+[1-9][0-9]{7,14}$",
                "description": "Canonical international WhatsApp contact; not proof of ownership."
              },
              "address": {
                "type": "string",
                "maxLength": 1000,
                "minLength": 1
              },
              "birthPlace": {
                "type": "string",
                "maxLength": 120,
                "minLength": 1
              },
              "birthDate": {
                "type": "string",
                "maxLength": 10,
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "description": "Real calendar date >=1000-01-01 and not after context.today in gym timezone. No age threshold."
              },
              "email": {
                "type": "string",
                "maxLength": 254,
                "format": "email"
              }
            },
            "description": "Incomplete legacy snapshots may omit fields; profileComplete=false prevents submit."
          },
          "status": {
            "$ref": "#/components/schemas/RegistrationStatus"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "offer": {
            "$ref": "#/components/schemas/PlanVersion"
          },
          "createdBy": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "allowedActions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RegistrationAction"
            }
          },
          "history": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ReviewEvent"
            }
          },
          "orderId": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1
          },
          "profileComplete": {
            "type": "boolean",
            "description": "False for legacy profiles missing required fields; submit returns PROFILE_INCOMPLETE."
          }
        },
        "required": [
          "id",
          "branchId",
          "memberId",
          "identity",
          "status",
          "version",
          "offer",
          "createdBy",
          "createdAt",
          "updatedAt",
          "allowedActions",
          "history",
          "profileComplete"
        ]
      },
