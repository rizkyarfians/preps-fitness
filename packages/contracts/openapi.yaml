                      "type": "string",
                      "enum": [
                        "REQUIRED",
                        "TOO_LONG",
                        "INVALID_FORMAT",
                        "INVALID_DATE",
                        "FUTURE_DATE",
                        "UNKNOWN_FIELD"
                      ]
                    }
                  },
                  "required": [
                    "field",
                    "code"
                  ]
                }
              },
              "currentVersion": {
                "type": "integer",
                "minimum": 1
              },
              "retryable": {
                "type": "boolean"
              }
            },
            "required": [
              "reasonCode",
              "requestId",
              "retryable"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
