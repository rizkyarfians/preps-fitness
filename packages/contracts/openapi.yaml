              },
              "address": {
                "type": "string",
                "maxLength": 1000,
                "minLength": 1
              },
              "birthPlace": {
                "type": "string",
                "maxLength": 120,
                "minLength": 1
              },
              "birthDate": {
                "type": "string",
                "maxLength": 10,
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "description": "Real calendar date >=1000-01-01 and not after context.today in gym timezone. No age threshold."
              },
              "email": {
                "type": "string",
                "maxLength": 254,
                "format": "email"
              }
            }
          },
          "accountLinked": {
