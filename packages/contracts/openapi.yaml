                  "ACCOUNT_ACCESS_DENIED",
                  "BRANCH_ACCESS_DENIED",
                  "ACTION_NOT_ALLOWED",
                  "NOT_FOUND",
                  "VALIDATION_FAILED",
                  "STALE_VERSION",
                  "INVALID_TRANSITION",
                  "IDEMPOTENCY_CONFLICT",
                  "COMMAND_IN_PROGRESS",
                  "DUPLICATE_REVIEW_REQUIRED",
                  "DUPLICATE_CHECK_STALE",
                  "EXISTING_REGISTRATION",
                  "PROFILE_INCOMPLETE",
                  "PLAN_UNAVAILABLE",
                  "RATE_LIMITED",
                  "SERVICE_UNAVAILABLE",
                  "INVALID_JSON",
                  "PAYLOAD_TOO_LARGE"
                ]
              },
              "requestId": {
                "type": "string",
                "maxLength": 100
              },
              "fieldErrors": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
